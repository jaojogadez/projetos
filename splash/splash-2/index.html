<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela Inicial (antes do clique) -->
    <div class="initial-screen">
        <h1>Bem Vindo ao <br> DevFy</h1>
        <button id="playButton">Aperte o play</button>
    </div>

    <!-- Elementos da Animação (inicialmente ocultos) -->
    <div class="splash-animation">
        <img src="disco.png" alt="Disco girando" class="disco">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
