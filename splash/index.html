<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash">
        <img src="./logo-1.png" alt="Logo do App" class="splash-logo">
        <div class="spinner"></div> <!-- Opcional: loading animado -->
    </div>

    <!-- Conteúdo principal (oculto inicialmente) -->
    <div class="content">
        <h1>Meu App</h1>
        <p>Bem-vindo ao aplicativo!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
